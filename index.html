<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام راسخ - بوابة الدخول</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="rasikh-container">

        <!-- =================================================================
             [1] الترويسة والشعار
             - طريقة التعديل: عدّل النص بين الوسوم لتغيير الاسم أو الوصف.
             ================================================================= -->
        <div class="header-section">
            <h1>نظام راسخ</h1>
            <p>بوابة الدخول وإدارة الحلقات والطلاب</p>
        </div>


        <!-- =================================================================
             [2] أزرار التبديل بين (تسجيل دخول) و (مستخدم جديد)
             - الوظيفة: تُبدّل تلقائياً بين نموذج الدخول ونموذج التسجيل الجديد.
             ================================================================= -->
        <div class="auth-tabs" id="authTabs">
            <button type="button" class="tab-btn active" id="tabLogin" onclick="switchMode('login')">تسجيل دخول</button>
            <button type="button" class="tab-btn" id="tabRegister" onclick="switchMode('register')">مستخدم جديد</button>
        </div>


        <!-- =================================================================
             [3] المرحلة الأولى: إدخال البيانات الأساسية
             - طريقة التعديل: لإضافة حقل جديد في التسجيل، ضعه داخل قسم (newUserFields).
             ================================================================= -->
        <form id="rasikhLoginForm">

            <!-- حقول تظهر فقط عند اختيار (مستخدم جديد) -->
            <div id="newUserFields" style="display: none;">
                <div class="form-group">
                    <label for="fullName" class="form-label">الاسم الثلاثي</label>
                    <input type="text" id="fullName" class="form-input" placeholder="أدخل اسمك الكامل">
                </div>

                <div class="form-group">
                    <label for="userRole" class="form-label">الصفة في النظام</label>
                    <select id="userRole" class="form-input">
                        <option value="teacher">معلم حلقة</option>
                        <option value="supervisor">مشرف مسجد</option>
                        <option value="admin">إدارة جمعية</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="inviteCode" class="form-label">كود الدعوة (اختياري)</label>
                    <input type="text" id="inviteCode" class="form-input" placeholder="أدخل الكود إن وُجد">
                </div>
            </div>

            <!-- الحقول المشتركة (البريد والجوال) -->
            <div class="form-group">
                <label for="userEmail" class="form-label">البريد الإلكتروني</label>
                <input type="email" id="userEmail" class="form-input" placeholder="example@domain.com" required>
            </div>

            <div class="form-group">
                <label for="userPhone" class="form-label">رقم الجوال</label>
                <input type="tel" id="userPhone" class="form-input" placeholder="05xxxxxxxx" required>
            </div>

            <!-- زر المتابعة (تم تغيير اسمه إلى تسجيل دخول) -->
            <button type="submit" class="btn-primary" id="mainSubmitBtn">تسجيل دخول</button>
            <button type="button" class="btn-secondary" onclick="sendInvitation()">إرسال دعوة</button>

        </form>


        <!-- =================================================================
             [4] المرحلة الثانية: اختيار وسيلة استلام رمز التحقق (جوال أو بريد)
             - الوظيفة: تظهر بعد الضغط على (تسجيل دخول) ليختار المستخدم أين يصل الرمز.
             ================================================================= -->
        <div id="otpMethodSection" style="display: none;">
            <p class="step-title">اختر وسيلة استلام رمز التحقق:</p>

            <div class="method-options">
                <label class="method-card">
                    <input type="radio" name="otpChannel" value="phone" checked>
                    <span>📱 عبر الجوال (<strong id="displayPhone"></strong>)</span>
                </label>

                <label class="method-card">
                    <input type="radio" name="otpChannel" value="email">
                    <span>✉️ عبر البريد (<strong id="displayEmail"></strong>)</span>
                </label>
            </div>

            <button type="button" class="btn-primary" onclick="sendSelectedOtp()">إرسال رمز التحقق</button>
            <button type="button" class="btn-secondary" onclick="backToStep1()">رجوع لتعديل البيانات</button>
        </div>


        <!-- =================================================================
             [5] المرحلة الثالثة: إدخال رمز التحقق المُرسل
             - طريقة التعديل: لتغيير عدد أرقام الرمز، عدّل رقم (maxlength="4").
             ================================================================= -->
        <div id="otpVerifySection" style="display: none;">
            <p class="step-title" id="otpSentMessage">تم إرسال الرمز بنجاح</p>

            <div class="form-group">
                <label for="otpInput" class="form-label">أدخل رمز التحقق (4 أرقام)</label>
                <input type="number" id="otpInput" class="form-input otp-box" placeholder="• • • •" maxlength="4">
            </div>

            <button type="button" class="btn-primary" onclick="verifyOtpCode()">تأكيد والدخول للنظام</button>
            <button type="button" class="btn-secondary" onclick="backToMethod()">تغيير وسيلة الإرسال</button>
        </div>


        <!-- =================================================================
             [6] استرجاع النسخة الاحتياطية (أسفل الصفحة بخط صغير)
             ================================================================= -->
        <div class="footer-actions">
            <a href="#" id="restoreBackupLink" class="backup-link">استرجاع نسخة احتياطية للنظام</a>
        </div>

    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
